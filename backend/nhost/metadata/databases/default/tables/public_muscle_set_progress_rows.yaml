table:
  name: muscle_set_progress_rows
  schema: public
configuration:
  custom_name: muscleSetProgressRows
  column_config:
    user_id:
      custom_name: userId
    day:
      custom_name: day
    muscle_group:
      custom_name: muscleGroup
    direct_sets:
      custom_name: directSets
    indirect_sets:
      custom_name: indirectSets
    weighted_sets:
      custom_name: weightedSets
    rolling_direct_sets:
      custom_name: rollingDirectSets
    rolling_indirect_sets:
      custom_name: rollingIndirectSets
    rolling_weighted_sets:
      custom_name: rollingWeightedSets
select_permissions:
  - role: user
    permission:
      columns:
        - day
        - muscle_group
        - direct_sets
        - indirect_sets
        - weighted_sets
        - rolling_direct_sets
        - rolling_indirect_sets
        - rolling_weighted_sets
      filter:
        user_id:
          _eq: X-Hasura-User-Id
