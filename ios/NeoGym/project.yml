name: NeoGym
options:
  minimumXcodeGenVersion: 2.44.0
  postGenCommand: python3 Scripts/disable-xcode-debug-options.py
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
packages:
  NeoGymKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: C7HCKFA2LG
schemes:
  NeoGymWatch:
    build:
      targets:
        NeoGymWatch: all
    run:
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
      disableMainThreadChecker: true
      disableThreadPerformanceChecker: true
  NeoGym:
    build:
      targets:
        NeoGym: all
    run:
      # Keep regenerated schemes from turning on costly default diagnostics.
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
      disableMainThreadChecker: true
      disableThreadPerformanceChecker: true
targets:
  NeoGym:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    resources:
      - path: App/Assets.xcassets
      - path: App/LaunchScreen.storyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: io.nhost.dbarroso.neogym
            CFBundleURLSchemes:
              - neogym
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: >-
          NeoGym reads workouts, weight, body-fat percentage, active energy,
          and resting energy from Apple Health to keep private workout imports
          and body and energy logs up to date.
        NSHealthUpdateUsageDescription: >-
          NeoGym does not write to Apple Health. It only reads your workouts,
          weight, body-fat percentage, active energy, and resting energy to
          update your NeoGym records.
        NeoGymSharedKeychainAccessGroup: >-
          $(AppIdentifierPrefix)io.nhost.neogym.shared
    entitlements:
      path: App/NeoGym.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.io.nhost.dbarroso.neogym
        keychain-access-groups:
          - "$(AppIdentifierPrefix)io.nhost.neogym.shared"
    dependencies:
      - package: NeoGymKit
        product: NeoGymKit
      - target: NeoGymWidgets
        embed: true
      - target: NeoGymWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nhost.dbarroso.neogym
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_NAME: NeoGym
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  NeoGymWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: Watch
        excludes:
          - Info.plist
    dependencies:
      - package: NeoGymKit
        product: NeoGymKit
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: NeoGym
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.nhost.dbarroso.neogym
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nhost.dbarroso.neogym.watchkitapp
        PRODUCT_NAME: NeoGymWatch
        INFOPLIST_FILE: Watch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  NeoGymWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: NeoGymKit
        product: NeoGymKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: NeoGym Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NeoGymSharedKeychainAccessGroup: >-
          $(AppIdentifierPrefix)io.nhost.neogym.shared
    entitlements:
      path: Widgets/NeoGymWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.nhost.dbarroso.neogym
        keychain-access-groups:
          - "$(AppIdentifierPrefix)io.nhost.neogym.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nhost.dbarroso.neogym.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_NAME: NeoGymWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
