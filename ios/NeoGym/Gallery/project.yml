# Documentation-only apps: no extensions, production runtime or entitlements.
name: NeoGymGallery
options:
  minimumXcodeGenVersion: 2.44.0
packages:
  NeoGymKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEOGYM_GALLERY"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GalleryPhone:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Shared
      - path: Phone
      - path: scenes.json
      - path: ../Widgets/EnergyBalanceWidget.swift
      - path: ../Widgets/RestTimerLiveActivityWidget.swift
      - path: ../Widgets/WidgetTheme.swift
      - path: ../Widgets/Assets.xcassets
      - path: ../WidgetUI
      - path: ../Shared/RestTimerActivityAttributes.swift
      - path: ../App/LaunchScreen.storyboard
    dependencies:
      - package: NeoGymKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nhost.neogym.gallery.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: NeoGym Gallery
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GalleryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: Shared
      - path: Watch
      - path: scenes.json
      - path: ../WidgetUI
      - path: ../Watch/WatchPageModels.swift
      - path: ../Watch/WatchComponents.swift
      - path: ../Watch/WatchTodayPages.swift
      - path: ../Watch/WatchAccountPages.swift
      - path: ../WatchWidgets/WatchEnergyComplication.swift
    dependencies:
      - package: NeoGymKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nhost.neogym.gallery.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: NeoGym Gallery
